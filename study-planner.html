<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Planner - VUSphere</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f5ff;
            color: #222;
        }

        .planner-header {
            background: linear-gradient(
                135deg,
                #5b3df5,
                #7d63ff
            );

            color: white;
            padding: 25px 20px;
        }

        .header-content {
            max-width: 1100px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .home-btn {
            text-decoration: none;

            background: white;
            color: #5b3df5;

            padding: 10px 16px;
            border-radius: 10px;

            font-weight: 600;
        }

        .planner-container {
            max-width: 1100px;

            margin: 35px auto;
            padding: 0 20px;
        }

        .planner-title {
            text-align: center;
            margin-bottom: 25px;
        }

        .planner-title h2 {
            color: #5b3df5;
            margin-bottom: 7px;
        }

        .planner-title p {
            color: #777;
        }

        .calendar-box,
        .task-panel {
            background: white;

            padding: 25px;

            border-radius: 18px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);

            margin-bottom: 25px;
        }

        .calendar-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .calendar-top button {
            width: 40px;
            height: 40px;

            border: none;

            border-radius: 50%;

            background: #eeeaff;
            color: #5b3df5;

            font-size: 24px;
            cursor: pointer;
        }

        .calendar-days {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            text-align: center;

            margin-bottom: 10px;
        }

        .calendar-days div {
            font-weight: 600;
            color: #777;

            padding: 10px 0;
        }

        .calendar-dates {
            display: grid;

            grid-template-columns:
                repeat(7, 1fr);

            gap: 8px;
        }

        .calendar-date {
            min-height: 110px;

            padding: 8px;

            border-radius: 12px;

            cursor: pointer;

            border: 1px solid #ececec;

            transition: 0.2s;

            overflow: hidden;
        }

        .calendar-date:hover {
            background: #f3f0ff;
        }

        .calendar-date.active {
            border: 2px solid #5b3df5;
            background: #f3f0ff;
        }

        .calendar-date.today {
            box-shadow:
                inset 0 0 0 2px #5b3df5;
        }

        .date-number {
            font-weight: 700;

            margin-bottom: 6px;

            color: #333;
        }

        .calendar-task-preview {
            background: #eeeaff;

            color: #4d35d4;

            border-radius: 7px;

            padding: 5px 6px;

            margin-top: 4px;

            font-size: 11px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .calendar-task-preview.completed {
            opacity: 0.55;

            text-decoration: line-through;
        }

        .reminder-icon {
            margin-right: 3px;
        }

        .more-tasks {
            margin-top: 5px;

            font-size: 11px;

            color: #777;

            text-align: center;
        }

        .empty-date {
            min-height: 110px;
        }

        .selected-date {
            text-align: center;

            background: #f3f0ff;

            padding: 15px;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .selected-date span {
            color: #777;

            font-size: 13px;
        }

        .selected-date h3 {
            margin-top: 4px;

            color: #5b3df5;
        }

        .task-form {
            display: grid;

            grid-template-columns:
                2fr 1fr;

            gap: 12px;

            margin-bottom: 20px;
        }

        .task-form input,
        .task-form select {
            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 14px;
        }

        .reminder-row {
            grid-column: 1 / -1;

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 10px 0;
        }

        .reminder-row label {
            font-size: 14px;
        }

        .task-form button {
            grid-column: 1 / -1;

            padding: 13px;

            border: none;

            border-radius: 10px;

            background: #5b3df5;

            color: white;

            font-weight: 600;

            cursor: pointer;
        }

        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 12px;

            background: #f8f7ff;

            padding: 14px;

            border-radius: 12px;

            margin-top: 10px;
        }

        .task-info {
            flex: 1;
        }

        .task-info h4 {
            margin-bottom: 4px;
        }

        .task-info p {
            color: #777;

            font-size: 13px;
        }

        .task-actions {
            display: flex;
            gap: 7px;
        }

        .task-actions button {
            width: 36px;
            height: 36px;

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }

        .complete-btn {
            background: #e4f8e8;
        }

        .delete-btn {
            background: #ffe5e5;
        }

        .task-item.completed h4 {
            text-decoration: line-through;

            opacity: 0.6;
        }

        .no-task {
            text-align: center;

            color: #888;

            padding: 20px;
        }

        @media (max-width: 700px) {

            .task-form {
                grid-template-columns: 1fr;
            }

            .calendar-date {
                min-height: 80px;

                padding: 5px;
            }

            .calendar-task-preview {
                font-size: 9px;
            }

            .calendar-days div {
                font-size: 11px;
            }

        }

    </style>

</head>

<body>

<header class="planner-header">

    <div class="header-content">

        <h1>📅 VUSphere Study Planner</h1>

        <a href="index.html"
           class="home-btn">
            ← Home
        </a>

    </div>

</header>


<main class="planner-container">

    <div class="planner-title">

        <h2>Plan Your Study Schedule</h2>

        <p>
            Add tasks directly to your calendar
            and set study reminders.
        </p>

    </div>


    <section class="calendar-box">

        <div class="calendar-top">

            <button onclick="previousMonth()">
                ‹
            </button>

            <h3 id="calendarMonth">
                Month
            </h3>

            <button onclick="nextMonth()">
                ›
            </button>

        </div>


        <div class="calendar-days">

            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
            <div>Sun</div>

        </div>


        <div
            id="calendarDates"
            class="calendar-dates">
        </div>

    </section>


    <section class="task-panel">

        <div class="selected-date">

            <span>Selected Date</span>

            <h3 id="selectedDateText">
                Select a date
            </h3>

        </div>


        <div class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter study task">


            <input
                type="text"
                id="courseInput"
                placeholder="Course code e.g. CS201">


            <input
                type="time"
                id="taskTime">


            <select id="reminderBefore">

                <option value="0">
                    At task time
                </option>

                <option value="5">
                    5 minutes before
                </option>

                <option value="10">
                    10 minutes before
                </option>

                <option value="30">
                    30 minutes before
                </option>

                <option value="60">
                    1 hour before
                </option>

            </select>


            <div class="reminder-row">

                <input
                    type="checkbox"
                    id="reminderCheck">

                <label for="reminderCheck">
                    🔔 Remind me
                </label>

            </div>


            <button onclick="addTask()">
                + Add Task
            </button>

        </div>


        <div class="task-list">

            <h3>Study Tasks</h3>

            <div id="taskList">

                <p class="no-task">
                    Select a date to view tasks.
                </p>

            </div>

        </div>

    </section>

</main>


<script>

let currentDate = new Date();

let selectedDate = null;

let tasks =
    JSON.parse(
        localStorage.getItem(
            "vusphereStudyTasks"
        )
    ) || [];


/* =========================
   CALENDAR
========================= */

function renderCalendar() {

    const calendarDates =
        document.getElementById(
            "calendarDates"
        );

    const calendarMonth =
        document.getElementById(
            "calendarMonth"
        );

    calendarDates.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const monthNames = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"
    ];

    calendarMonth.textContent =
        monthNames[month] +
        " " +
        year;


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    const startDay =
        firstDay === 0
            ? 6
            : firstDay - 1;


    for (
        let i = 0;
        i < startDay;
        i++
    ) {

        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "empty-date";

        calendarDates.appendChild(
            empty
        );

    }


    for (
        let day = 1;
        day <= daysInMonth;
        day++
    ) {

        const dateBox =
            document.createElement(
                "div"
            );


        dateBox.className =
            "calendar-date";


        const fullDate =
            year +
            "-" +
            String(
                month + 1
            ).padStart(2, "0") +
            "-" +
            String(day).padStart(
                2,
                "0"
            );


        const dateNumber =
            document.createElement(
                "div"
            );

        dateNumber.className =
            "date-number";

        dateNumber.textContent =
            day;

        dateBox.appendChild(
            dateNumber
        );
        
        const quickAddBtn =
    document.createElement("button");

quickAddBtn.className =
    "calendar-add-btn";

quickAddBtn.textContent =
    "+ Add";

quickAddBtn.onclick =
    function (event) {

        event.stopPropagation();

        selectedDate = fullDate;

        updateSelectedDate();

        openQuickAdd(fullDate);
    };

dateBox.appendChild(
    quickAddBtn
);


        const dateTasks =
            tasks.filter(
                task =>
                    task.date === fullDate
            );


        dateTasks
            .slice(0, 3)
            .forEach(
                function (task) {

                    const preview =
                        document.createElement(
                            "div"
                        );


                    preview.className =
                        "calendar-task-preview" +
                        (
                            task.completed
                                ? " completed"
                                : ""
                        );


                    let previewText = "";

                    if (task.reminder) {
                        previewText += "🔔 ";
                    }


                    if (task.course) {
                        previewText +=
                            task.course +
                            " ";
                    }


                    previewText +=
                        task.task;


                    if (task.time) {

                        previewText +=
                            " • " +
                            formatTime(
                                task.time
                            );

                    }


                    preview.textContent =
                        previewText;


                    dateBox.appendChild(
                        preview
                    );

                }
            );


        if (
            dateTasks.length > 3
        ) {

            const more =
                document.createElement(
                    "div"
                );

            more.className =
                "more-tasks";

            more.textContent =
                "+" +
                (
                    dateTasks.length - 3
                ) +
                " more";

            dateBox.appendChild(
                more
            );

        }


        const today =
            new Date();


        const todayString =
            today.getFullYear() +
            "-" +
            String(
                today.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                today.getDate()
            ).padStart(2, "0");


        if (
            fullDate === todayString
        ) {

            dateBox.classList.add(
                "today"
            );

        }


        if (
            fullDate === selectedDate
        ) {

            dateBox.classList.add(
                "active"
            );

        }


        dateBox.onclick =
            function () {

                selectedDate =
                    fullDate;

                updateSelectedDate();

                renderCalendar();

                displayTasks();

            };


        calendarDates.appendChild(
            dateBox
        );

    }

}


function previousMonth() {

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();

}


function nextMonth() {

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();

}


/* =========================
   SELECTED DATE
========================= */

function updateSelectedDate() {

    const selectedText =
        document.getElementById(
            "selectedDateText"
        );


    if (!selectedDate) {

        selectedText.textContent =
            "Select a date";

        return;

    }


    const date =
        new Date(
            selectedDate +
            "T00:00:00"
        );


    selectedText.textContent =
        date.toLocaleDateString(
            "en-GB",
            {

                day: "numeric",
                month: "long",
                year: "numeric"

            }
        );

}


/* =========================
   ADD TASK
========================= */

function addTask() {

    if (!selectedDate) {

        alert(
            "Please select a date first."
        );

        return;

    }


    const taskInput =
        document.getElementById(
            "taskInput"
        );


    const courseInput =
        document.getElementById(
            "courseInput"
        );


    const timeInput =
        document.getElementById(
            "taskTime"
        );


    const reminderCheck =
        document.getElementById(
            "reminderCheck"
        );


    const reminderBefore =
        document.getElementById(
            "reminderBefore"
        );


    const taskName =
        taskInput.value.trim();


    const course =
        courseInput.value
            .trim()
            .toUpperCase();


    const time =
        timeInput.value;


    if (taskName === "") {

        alert(
            "Please enter a study task."
        );

        return;

    }


    if (
        reminderCheck.checked &&
        time === ""
    ) {

        alert(
            "Please select a time for the reminder."
        );

        return;

    }


    tasks.push({

        id: Date.now(),

        date: selectedDate,

        task: taskName,

        course: course,

        time: time,

        reminder:
            reminderCheck.checked,

        reminderBefore:
            Number(
                reminderBefore.value
            ),

        reminded: false,

        completed: false

    });


    saveTasks();


    taskInput.value = "";

    courseInput.value = "";

    timeInput.value = "";

    reminderCheck.checked =
        false;


    displayTasks();

    renderCalendar();

    requestNotificationPermission();

}


/* =========================
   DISPLAY TASKS
========================= */

function displayTasks() {

    const taskList =
        document.getElementById(
            "taskList"
        );


    taskList.innerHTML = "";


    if (!selectedDate) {

        taskList.innerHTML =
            '<p class="no-task">Select a date to view tasks.</p>';

        return;

    }


    const dateTasks =
        tasks.filter(
            task =>
                task.date ===
                selectedDate
        );


    if (
        dateTasks.length === 0
    ) {

        taskList.innerHTML =
            '<p class="no-task">No study tasks for this date.</p>';

        return;

    }


    dateTasks.forEach(
        function (task) {

            const taskBox =
                document.createElement(
                    "div"
                );


            taskBox.className =
                "task-item" +
                (
                    task.completed
                        ? " completed"
                        : ""
                );


            let details =
                task.course ||
                "No Course";


            if (task.time) {

                details +=
                    " • " +
                    formatTime(
                        task.time
                    );

            }


            if (task.reminder) {

                details +=
                    " • 🔔 Reminder";

            }


            taskBox.innerHTML = `

                <div class="task-info">

                    <h4>
                        ${task.task}
                    </h4>

                    <p>
                        ${details}
                    </p>

                </div>


                <div class="task-actions">

                    <button
                        class="complete-btn"
                        onclick="toggleTask(${task.id})">
                        ✅
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})">
                        🗑️
                    </button>

                </div>

            `;


            taskList.appendChild(
                taskBox
            );

        }
    );

}


/* =========================
   COMPLETE / DELETE
========================= */

function toggleTask(id) {

    tasks =
        tasks.map(
            function (task) {

                if (
                    task.id === id
                ) {

                    task.completed =
                        !task.completed;

                }

                return task;

            }
        );


    saveTasks();

    displayTasks();

    renderCalendar();

}


function deleteTask(id) {

    tasks =
        tasks.filter(
            task =>
                task.id !== id
        );


    saveTasks();

    displayTasks();

    renderCalendar();

}


/* =========================
   SAVE
========================= */

function saveTasks() {

    localStorage.setItem(
        "vusphereStudyTasks",
        JSON.stringify(tasks)
    );

}


/* =========================
   TIME FORMAT
========================= */

function formatTime(time) {

    if (!time) {
        return "";
    }


    const parts =
        time.split(":");


    let hour =
        Number(parts[0]);


    const minute =
        parts[1];


    const ampm =
        hour >= 12
            ? "PM"
            : "AM";


    hour =
        hour % 12;


    if (hour === 0) {
        hour = 12;
    }


    return (
        hour +
        ":" +
        minute +
        " " +
        ampm
    );

}


/* =========================
   NOTIFICATION PERMISSION
========================= */

function requestNotificationPermission() {

    if (
        "Notification" in window &&
        Notification.permission ===
        "default"
    ) {

        Notification
            .requestPermission();

    }

}


/* =========================
   CHECK REMINDERS
========================= */

function checkReminders() {

    const now =
        new Date();


    tasks.forEach(
        function (task) {

            if (
                !task.reminder ||
                !task.time ||
                task.reminded ||
                task.completed
            ) {

                return;

            }


            const taskDateTime =
                new Date(
                    task.date +
                    "T" +
                    task.time +
                    ":00"
                );


            const reminderTime =
                new Date(
                    taskDateTime.getTime() -
                    task.reminderBefore *
                    60 *
                    1000
                );


            const difference =
                now.getTime() -
                reminderTime.getTime();


            if (
                difference >= 0 &&
                difference < 60000
            ) {

                showReminder(
                    task
                );


                task.reminded =
                    true;


                saveTasks();

            }

        }
    );

}


/* =========================
   SHOW REMINDER
========================= */

function showReminder(task) {

    const message =
        (
            task.course
                ? task.course +
                  " - "
                : ""
        ) +
        task.task;


    if (
        "Notification" in window &&
        Notification.permission ===
        "granted"
    ) {

        new Notification(
            "🔔 VUSphere Study Reminder",
            {

                body:
                    message +
                    (
                        task.time
                            ? "\nTime: " +
                              formatTime(
                                  task.time
                              )
                            : ""
                    )

            }
        );

    } else {

        alert(
            "🔔 Study Reminder\n\n" +
            message
        );

    }

}


/* Check every 30 seconds */

setInterval(
    checkReminders,
    30000
);


renderCalendar();

checkReminders();

</script>


<script src="timer.js"></script>

</body>
</html>
