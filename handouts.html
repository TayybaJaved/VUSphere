<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        /* ==============================
           BASIC STYLE
        ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f6fc;
            color: #172033;
            transition: 0.3s;
        }


        /* ==============================
           HEADER
        ============================== */

        .handouts-header {
            background: linear-gradient(135deg, #5b3df5, #7c5cff);
            padding: 25px 7% 45px;
            color: white;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn,
        .theme-btn {
            border: 1px solid rgba(255,255,255,0.35);
            background: rgba(255,255,255,0.12);
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .back-btn:hover,
        .theme-btn:hover {
            background: white;
            color: #5b3df5;
        }


        /* ==============================
           HEADING
        ============================== */

        .header-content {
            max-width: 750px;
            margin: 40px auto 0;
            text-align: center;
        }

        .small-badge {
            display: inline-block;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.25);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .header-content h1 {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .header-content h1 span {
            color: #ffe45e;
        }

        .header-content p {
            color: #eeeeff;
            margin-bottom: 25px;
        }


        /* ==============================
           SEARCH
        ============================== */

        .search-box {
            max-width: 650px;
            margin: auto;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            outline: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            box-shadow: 0 7px 20px rgba(0,0,0,0.12);
        }


        /* ==============================
           MAIN CONTENT
        ============================== */

        .library-container {
            max-width: 1180px;
            margin: auto;
            padding: 35px 20px 70px;
        }

        .total-box {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .total-box span {
            background: white;
            padding: 9px 17px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            font-size: 13px;
        }

        .total-box strong {
            color: #5b3df5;
        }


        /* ==============================
           SUBJECT SECTION
        ============================== */

        .subject-section {
            margin-bottom: 45px;
        }

        .subject-heading {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .subject-heading::before,
        .subject-heading::after {
            content: "";
            height: 1px;
            background: #d9deeb;
            flex: 1;
        }

        .subject-heading h2 {
            font-size: 16px;
            color: #5b3df5;
            background: white;
            border: 1px solid #dfe3f0;
            padding: 7px 16px;
            border-radius: 8px;
            white-space: nowrap;
        }


        /* ==============================
           COURSE CARDS
        ============================== */

        .course-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .course-card {
            background: white;
            border-radius: 14px;
            padding: 20px;
            border: 1px solid #e7e9f2;
            transition: 0.25s;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(70, 55, 180, 0.12);
        }

        .course-code {
            display: inline-block;
            color: #5b3df5;
            font-weight: 800;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .course-name {
            font-size: 13px;
            color: #6f7687;
            min-height: 40px;
            margin-bottom: 15px;
        }

        .view-btn {
            width: 100%;
            border: none;
            background: #5b3df5;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }

        .view-btn:hover {
            background: #472bd7;
        }
        .handout-buttons {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.highlight-btn {
    width: 100%;
    border: 1px solid #5b3df5;
    background: white;
    color: #5b3df5;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
}

.highlight-btn:hover {
    background: #f0edff;
}

body.dark .highlight-btn {
    background: #252b42;
    color: #c7bbff;
    border-color: #7c5cff;
}


        /* ==============================
           NO RESULT
        ============================== */

        #noResult {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            color: #6f7687;
        }


        /* ==============================
           DARK MODE
        ============================== */

        body.dark {
            background: #111525;
            color: white;
        }

        body.dark .course-card,
        body.dark .subject-heading h2,
        body.dark .total-box span,
        body.dark #noResult {
            background: #1c2236;
            border-color: #30374d;
        }

        body.dark .course-name {
            color: #b7bdd0;
        }

        body.dark .subject-heading::before,
        body.dark .subject-heading::after {
            background: #30374d;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 950px) {

            .course-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 700px) {

            .course-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-content h1 {
                font-size: 32px;
            }

        }

        @media (max-width: 480px) {

            .course-grid {
                grid-template-columns: 1fr;
            }

            .handouts-header {
                padding-left: 20px;
                padding-right: 20px;
            }

            .back-btn,
            .theme-btn {
                padding: 8px 12px;
                font-size: 12px;
            }

        }

    </style>
</head>

    function displayHandouts(searchText = "") {

        handoutsContainer.innerHTML = "";

        let total = 0;

        const search =
            searchText.toLowerCase().trim();


        handoutGroups.forEach(group => {

            const filteredCourses =
                group.courses.filter(course =>

                    course.code
                    .toLowerCase()
                    .includes(search)

                    ||

                    course.name
                    .toLowerCase()
                    .includes(search)

                );


            if (filteredCourses.length > 0) {

                total += filteredCourses.length;

                    document.createElement("section");

                    "subject-section";

</div>

function downloadHandout(courseCode, highlighted = false) {

    const subjectFolder =
        courseCode.match(/[A-Za-z]+/)[0];

    const fileName = highlighted
        ? courseCode + "-Highlighted-Handouts.pdf"
        : courseCode + "-Handouts.pdf";

    const pdfPath =
        "handouts/" +
        subjectFolder +
        "/" +
        fileName;

    const link = document.createElement("a");
    link.href = pdfPath;
    link.download = fileName;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

  function openHandout(courseCode) {

    const subjectFolder =
        courseCode.match(/[A-Za-z]+/)[0];

    const pdfPath =
        "handouts/" +
        subjectFolder +
        "/" +
        courseCode +
        "-Handouts.pdf";

    // PDF open
    window.open(pdfPath, "_blank");

    // PDF download
    const link = document.createElement("a");
    link.href = pdfPath;
    link.download = courseCode + "-Handouts.pdf";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
